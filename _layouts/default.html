<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.author }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" class="nav-link" data-nav="home">Home</a>
        <a href="{{ '/blog.html' | relative_url }}" class="nav-link" data-nav="blog">Blog</a>
        <a href="{{ '/projects.html' | relative_url }}" class="nav-link" data-nav="projects">Projects</a>
      </nav>
    </div>
  </header>

  <main class="site-content wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author }}</p>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
